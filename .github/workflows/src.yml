
name: Source Release

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create source archive
        run: |
          git archive \
            --format=zip \
            --prefix=artificial-life/ \
            HEAD \
            -o artificial-life-source.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: source-${{ github.run_id }}-${{ github.run_attempt }}
          name: Source Release - ${{ github.sha }}
          body: |
            Automated source release.

            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}

            Contains the project source files only.
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: artificial-life-source.zip
